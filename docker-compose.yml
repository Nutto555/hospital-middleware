services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://hospital:hospital@postgres:5432/hospital?sslmode=disable
      JWT_SECRET: change-me-before-any-real-deployment
      JWT_TTL: 24h
      HOSPITAL_A_BASE_URL: http://hospital-a:8081
      HIS_TIMEOUT: 5s
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  hospital-a:
    build: .
    command: ["hismock"]
    environment:
      PORT: "8081"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/01-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
